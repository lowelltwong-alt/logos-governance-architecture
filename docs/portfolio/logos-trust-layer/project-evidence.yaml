capabilities:
  - capability_id: authority-and-trust-zones
    title: "Authority and trust-zone separation"
    maturity: active_control
    mechanism: "Typed trust zones, lifecycle state, provenance, review fields, and directional dependency rules keep candidate and inferred material from silently governing canonical surfaces."
    demonstrates: "Contract-first AI governance expressed as data structures and fail-closed rules rather than prompt aspiration alone."
    does_not_prove: "That every theological assertion is correct or that an AI can grant source, doctrinal, or publication authority."
    evidence:
      - kind: local_path
        target: schemas/logos_node_min.schema.json
        supports: "Minimum node identity, trust, lifecycle, provenance, and review contract."
      - kind: local_path
        target: schemas/logos_claim_min.schema.json
        supports: "Minimum claim, epistemic, evidence, and review contract."
      - kind: local_path
        target: AGENTS.md
        supports: "Repository-wide trust-zone direction and agent non-authority rules."
  - capability_id: cross-repository-contract-plane
    title: "Cross-repository custody by contract"
    maturity: active_control
    mechanism: "A registry, link contracts, dependency map, front doors, and validators separate the governance, Scripture, boundary, and doctrine-lineage planes."
    demonstrates: "Multi-repository system design with explicit upstream and downstream authority, ownership, and failure boundaries."
    does_not_prove: "That every child repository is at the same maturity or that a lower-trust plane can override Scripture or governance."
    evidence:
      - kind: local_path
        target: governance/LOGOS_REPO_REGISTRY.yaml
        supports: "Machine-readable repository roles and lifecycle states."
      - kind: local_path
        target: DATA_FLOW_MAP.md
        supports: "Human-readable cross-repository flow and authority direction."
      - kind: local_path
        target: governance/REPOSITORY_LINK_CONTRACTS.md
        supports: "Allowed link semantics and non-transfer of authority."
  - capability_id: ontology-taxonomy-and-schema-engineering
    title: "Ontology, taxonomy, and schema engineering"
    maturity: active_control
    mechanism: "Identity is separated from labels; doctrine topic, view, and assessment remain distinct; controlled vocabularies and versioned schemas define graph nodes, claims, genealogy edges, evidence, and gates."
    demonstrates: "Knowledge-engineering discipline across ontology, taxonomy, schema evolution, and graph semantics."
    does_not_prove: "A finished ontology, populated doctrine graph, resolved parent-cardinality decision, or universally accepted theological taxonomy."
    evidence:
      - kind: local_path
        target: docs/governance/ontology-discipline.md
        supports: "Ontology identity and layering discipline."
      - kind: local_path
        target: docs/governance/scripture-taxonomy-and-ontology.md
        supports: "Scripture classification and ontology boundaries."
      - kind: local_path
        target: schemas/doctrine_genealogy/genealogy_edge.v1.schema.json
        supports: "Typed doctrine-genealogy edge contract."
  - capability_id: provenance-graph-and-blast-radius
    title: "Provenance graph and reverse blast radius"
    maturity: active_control
    mechanism: "Typed dependencies, source pointers, consumer coverage, trust direction, and staleness rules make downstream effects inspectable and challengeable."
    demonstrates: "Graph engineering that treats evidence lineage and change impact as first-class controls."
    does_not_prove: "That graph proximity is evidence, that every edge is semantically true, or that stale evidence can remain load-bearing."
    evidence:
      - kind: local_path
        target: governance/GOVERNANCE_DEPENDENCY_MAP.yaml
        supports: "Typed governance dependencies, validators, update triggers, and downstream controls."
      - kind: local_path
        target: docs/governance/anti-guessing-and-evidence-discipline.md
        supports: "Rule that semantic similarity and model confidence cannot self-promote graph structure."
      - kind: local_path
        target: docs/roadmap/logos-stewardship-architecture-buildout/graph/typed-dependency-graph.yaml
        supports: "Specification-level dependency graph and blocked design coordinates."
  - capability_id: deterministic-validation-harnesses
    title: "Deterministic validators and harnesses"
    maturity: active_control
    mechanism: "Provider-neutral validators, negative fixtures, validation contracts, dependency-map checks, link checks, and CI-facing command registries turn bounded policy properties into executable gates."
    demonstrates: "Evidence-preserving engineering where a reviewer can rerun the exact check instead of trusting a narrative receipt."
    does_not_prove: "Semantic or theological correctness beyond each validator's stated contract, nor a timeless pass after inputs change."
    evidence:
      - kind: local_path
        target: scripts/validation_contracts.py
        supports: "Default validation command registry."
      - kind: local_path
        target: scripts/validate_governance_dependency_map.py
        supports: "Fail-closed governance dependency coverage."
      - kind: local_path
        target: tests/test_governance_dependency_map.py
        supports: "Focused regression coverage for the dependency-map contract."
  - capability_id: hierarchical-specialist-agent-mesh
    title: "Hierarchical specialist agent mesh"
    maturity: validated_specification_only
    mechanism: "A bounded role factory, completeness auditor, specialist taxonomy, source-pack contracts, citation and entailment checkers, counterevidence challenges, deterministic receipts, budgets, and human escalation are modeled before runtime selection."
    demonstrates: "Deep multi-agent workflow architecture with single-writer custody, independent checks, disagreement routing, and provider-neutral capability contracts."
    does_not_prove: "A running mesh, qualified agent experts, actual source research, cross-provider independence, a controller, or completed doctrine."
    evidence:
      - kind: local_path
        target: docs/roadmap/logos-stewardship-architecture-buildout/revisions/doctrine-mesh-v2/mesh/agent-mesh.v2.json
        supports: "Specification-level role graph, authority boundaries, and proof obligations."
      - kind: local_path
        target: docs/roadmap/logos-stewardship-architecture-buildout/revisions/doctrine-mesh-v2/mesh/completeness-auditor-contract.yaml
        supports: "Preflight, midflight, and postflight expert-completeness audit contract."
      - kind: local_path
        target: docs/roadmap/logos-stewardship-architecture-buildout/revisions/doctrine-mesh-v2/research/expert-pack-contract.yaml
        supports: "Source-bound ExpertPack contract without treating summaries as evidence."
  - capability_id: public-ai-interrogation-surface
    title: "AI-interrogable public portfolio"
    maturity: dated_validation_snapshot
    mechanism: "A human landing page, machine-readable evidence manifest, JSON Schema, skeptic prompt, deterministic validator, tests, and receipt route every claim back to inspectable code and explicit limits."
    demonstrates: "Communication design for recruiters and technical evaluators who want their own AI to challenge project claims."
    does_not_prove: "That a portfolio summary supersedes repository evidence or that a passing structure check guarantees every interpretation."
    evidence:
      - kind: local_path
        target: PORTFOLIO.md
        supports: "Human-facing recruiter entry and architecture diagrams."
      - kind: local_path
        target: docs/portfolio/logos-trust-layer/project-evidence.schema.json
        supports: "Machine contract for the project evidence packet."
      - kind: local_path
        target: scripts/validate_portfolio_front_door.py
        supports: "Deterministic claim, link, privacy, and frozen-specification checks."
