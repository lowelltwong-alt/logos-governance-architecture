evidence_routes:
  - route_id: recruiter-overview
    question: "What was designed, what exists now, and why is it relevant to an AI engineering or engagement role?"
    start_at: PORTFOLIO.md
    then_read:
      - docs/portfolio/logos-trust-layer/README.md
      - docs/portfolio/logos-trust-layer/project-evidence.yaml
  - route_id: skeptical-ai-audit
    question: "How can another AI independently test the portfolio claims and identify overstatement?"
    start_at: docs/portfolio/logos-trust-layer/AI-INTERROGATION-PROMPT.md
    then_read:
      - docs/portfolio/logos-trust-layer/project-evidence.schema.json
      - scripts/validate_portfolio_front_door.py
      - tests/test_portfolio_front_door.py
  - route_id: doctrine-mesh-design
    question: "What is in the doctrine mesh, and what does its validation explicitly not authorize?"
    start_at: docs/roadmap/logos-stewardship-architecture-buildout/revisions/doctrine-mesh-v2/README.md
    then_read:
      - docs/roadmap/logos-stewardship-architecture-buildout/revisions/doctrine-mesh-v2/revision-manifest.yaml
      - docs/roadmap/logos-stewardship-architecture-buildout/revisions/doctrine-mesh-v2/checks/validation-receipt.json
