maturity_vocabulary:
  - code: active_control
    definition: "A checked-in governance, schema, registry, navigation, or validation control used by the repository."
    does_not_imply: "Production deployment, perfect coverage, semantic correctness, or authority outside its stated contract."
  - code: active_data_plane
    definition: "A checked-in repository surface that stores or derives governed data artifacts under upstream contracts."
    does_not_imply: "An agent runtime, a complete corpus, current CI success, or authority to change upstream governance."
  - code: active_scaffold
    definition: "A guarded repository foundation whose schemas and validators intentionally precede substantive data admission."
    does_not_imply: "A populated corpus, completed domain model, or permission to import sources and make doctrine claims."
  - code: validated_specification_only
    definition: "A frozen design package whose structure, contracts, links, fixtures, and digests passed bounded static checks."
    does_not_imply: "A running system, qualified experts, live research, source ingestion, doctrinal correctness, or production readiness."
  - code: dated_validation_snapshot
    definition: "A result bound to one exact revision, command, input set, and observation time."
    does_not_imply: "A timeless guarantee or a pass after code, dependencies, data, runtime, provider, or policy changes."
  - code: roadmap_only
    definition: "A planned value horizon or design question that remains unimplemented and separately authority-gated."
    does_not_imply: "A schedule commitment, delivered capability, selected architecture, or permission to begin the work."
