  - route_id: trust-and-custody
    question: "How are authority, evidence, trust zones, and cross-repository custody kept separate?"
    start_at: AI_FRONT_DOOR.md
    then_read:
      - DATA_FLOW_MAP.md
      - governance/LOGOS_REPO_REGISTRY.yaml
      - governance/REPOSITORY_LINK_CONTRACTS.md
      - governance/GOVERNANCE_DEPENDENCY_MAP.yaml
  - route_id: deterministic-validation
    question: "Which executable checks support the public packet and where are their limits recorded?"
    start_at: scripts/validate_portfolio_front_door.py
    then_read:
      - tests/test_portfolio_front_door.py
      - scripts/validation_contracts.py
      - docs/portfolio/logos-trust-layer/validation-receipt.json
planned_value_horizons:
  - horizon_id: nonprofit-christian-knowledge-stewardship
    status: roadmap_only
    potential_value: "Help a faith-based nonprofit organize sources, doctrine questions, institutional decisions, and AI assistance without hiding authority or provenance."
    required_before_claiming_delivery: "Qualified stakeholders, source and rights policy, domain review, scoped implementation, runtime qualification, user testing, and publication approval."
  - horizon_id: manuscript-language-and-translation-provenance
    status: roadmap_only
    potential_value: "Connect manuscript, Hebrew, Aramaic, Koine Greek, translation, passage, and interpretive evidence while preserving witness and claim boundaries."
    required_before_claiming_delivery: "Rights-cleared sources, qualified language and textual-critical review, validated schemas, real fixtures, and non-AI authority decisions."
  - horizon_id: doctrine-genealogy-and-tradition-slices
    status: roadmap_only
    potential_value: "Trace how doctrine positions, historical witnesses, councils, traditions, disputes, and reception claims relate without flattening them into one answer."
    required_before_claiming_delivery: "Qualified theological and historical review, source admission, tradition policy, populated lineage records, and independent validation."
  - horizon_id: governed-specialist-research-mesh
    status: roadmap_only
    potential_value: "Coordinate bounded researchers and checkers across biblical studies, languages, history, archaeology, traditions, philosophy, rights, provenance, and safety."
    required_before_claiming_delivery: "Qualified source packs and humans, a selected and tested runtime, provider and budget controls, semantic fixtures, privacy review, and explicit activation authority."
explicit_non_claims:
  - "This portfolio does not claim a production AI platform or deployed service."
  - "The doctrine mesh is not a running system and no controller has been activated."
  - "The doctrine mesh is not a completed doctrine corpus and contains no substantive doctrine decisions."
  - "The doctrine mesh is not qualified theological authority and cannot approve Scripture, exegesis, doctrine, or tradition policy."
  - "No ExpertPack in the doctrine-mesh specification is currently qualified or execution-ready."
  - "No source corpus was ingested by the doctrine-mesh specification campaign."
  - "A deterministic validator pass proves only its bounded structural and policy contract, not semantic or theological correctness."
  - "Graph proximity, embeddings, generated confidence, or agent consensus cannot promote a candidate to governed truth."
  - "The recorded independent review is partly verified and does not claim cross-provider independence."
  - "Roadmap horizons are possible applications, not delivered features, schedules, or standing authorization."
