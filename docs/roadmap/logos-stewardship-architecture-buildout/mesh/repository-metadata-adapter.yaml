repository_contract:
  family_claim_ref: governance/registry/FAMILY_WORK_REGISTRY.yaml#WORK-GOV-LOGOS-STEWARDSHIP-BUILDOUT-001
  campaign_tree: docs/roadmap/logos-stewardship-architecture-buildout/
  sole_content_writer: specification-writer
  independent_checker: independent-authority-checker
  controller_state_owner_if_later_activated: campaign-controller
  controller_state_root: docs/roadmap/logos-stewardship-architecture-buildout/state/
  max_direct_fanout: 3
  max_delegation_depth: 1
  worker_delegation_allowed: false
  execution_authorized: false
  external_research_authorized: false
  implementation_authorized: false
  migration_authorized: false
  publication_authorized: false

authority_adapter:
  source_authority_refs:
    - AGENTS.md
    - AI_FRONT_DOOR.md
    - governance/FAMILY_WORK_COORDINATION_STANDARD.yaml
    - governance/registry/FAMILY_WORK_REGISTRY.yaml
    - docs/governance/logos-convergence-advisory-review.yaml
  allowed_current_effects:
    - read_pinned_local_evidence
    - write_candidate_specification_inside_claimed_campaign_tree
    - run_local_read_only_or_deterministic_validation
    - return_read_only_specialist_packets
  prohibited_effects:
    - write_outside_claim
    - substantive_architecture_or_schema_implementation
    - theology_source_tradition_or_policy_decision
    - controller_or_runtime_activation
    - external_provider_or_paid_service_call
    - private_data_copy_or_credential_access
    - migration_deployment_publication_push_pr_or_remote_merge
    - cleanup_reset_rebase_force_operation_or_deletion
  data_classes_allowed: [public_repository_metadata, scrubbed_candidate_specification, non_content_validation_receipt]
  data_classes_prohibited: [secret, credential, raw_private_source, raw_conversation, unapproved_client_payload]
  human_gate_registry_ref: human-gates.yaml

