topology:
  dispatch_shape: controller_direct_depth_one
  direct_assignment_only: true
  foremen_are_read_only_synthesizers_not_delegators: true
  sample_waves:
    - {wave_id: graph_specification, direct_roles: [specification-writer, provenance-graph-specialist, independent-authority-checker], max_parallel: 3}
    - {wave_id: research_design, direct_roles: [research-evidence-foreman, primary-source-researcher, source-rights-specialist], max_parallel: 3}
    - {wave_id: evaluation_design, direct_roles: [empirical-methods-specialist, statistical-review-specialist, information-retrieval-specialist], max_parallel: 3}
    - {wave_id: safety_design, direct_roles: [privacy-security-custody-specialist, authentication-boundary-specialist, migration-safety-specialist], max_parallel: 3}

independence_adapter:
  different_role_id_alone_is_proof: false
  checker_assignment_isolated: true
  checker_shared_authorship_prohibited: true
  checker_reads_raw_permitted_evidence: true
  checker_attempt_lineage_required: true
  changed_revision_invalidates_result: true
  independent_result_may_clear_human_gate: false

portability_adapter:
  portable_core_has_provider_binding: false
  capability_tiers_are_mutable: true
  runtime_adapter_ref: controller/runtime-adapter-contract.yaml
  runtime_adapter_status: unbound
  provider_probe_receipt: null
  harness_receipt: null
  portability_claim_status: unverified
  invalidation_triggers: [runtime, model, provider, tools, context, privacy, effects, authority, schema, dependencies, scope, human_gate, budget]

human_role_adapter:
  agent_may_impersonate_human: false
  agent_may_assert_human_qualification: false
  named_human_roles:
    - qualified-theology-exegesis-human
    - qualified-history-tradition-human
    - privacy-security-custody-human
    - qualified-primary-source-human
    - qualified-rights-review-human
    - human-campaign-sponsor
  qualification_source: owner_scoped_future_receipt_only
  current_qualified_human_assignments: []

binding_invariants:
  - "Every job has exactly one specification author and one checker; J-400 is explicitly human-checked."
  - "Future executor identity does not grant current execution authority."
  - "Controller state and repository content remain disjoint."
  - "A role card, graph edge, validator pass, model grade, or consensus result is never a human receipt."
  - "Specialists return candidate packets; only the sole content writer may encode accepted packets in the repository."
