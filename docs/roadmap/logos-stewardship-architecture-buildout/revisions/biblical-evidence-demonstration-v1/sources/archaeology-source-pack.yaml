claim_records:
  - claim_id: claim-sennacherib-campaign-judah
    case_id: sennacherib-lachish
    question: "What distinct inscriptional, iconographic, and archaeological evidence bears on the Assyrian campaign in Judah conventionally dated to 701 BCE?"
    safe_assertion: "Assyrian royal inscriptions, palace reliefs depicting Lachish, and excavated destruction evidence are distinct evidence types relevant to reconstructing the campaign."
    source_refs:
      - bm-sennacherib-prism-91032
      - oracc-rinap-q003496
      - bm-lachish-relief-124906
      - iaa-lachish-gate-2018
      - atiqot-lachish-gate-2023
      - pnas-archaeomagnetic-lachish-2022
      - israel-museum-sennacherib-display-2025
    scripture_comparison_anchors: [2Kgs.18-2Kgs.19, Isa.36-Isa.37, 2Chr.32]
    uncertainty: medium
    counterpositions:
      - "Royal inscriptions are strategic self-presentation and omission is not neutral evidence."
      - "Synchronizing individual destruction contexts with named campaigns requires independent chronological argument."
      - "The sources do not by themselves explain the non-capture of Jerusalem or establish theological causation."
    cannot_establish:
      - complete_harmonization_of_all_accounts
      - exact_reason_jerusalem_was_not_captured
      - theological_causation
    required_review_classes: [assyriologist, iron_age_levant_archaeologist, hebrew_bible_historian]
    authority_effect: none
  - claim_id: claim-tel-dan-bytdwd
    case_id: tel-dan
    question: "How should the fragmentary Aramaic sequence bytdwd be read and what limited historical claims can it bear?"
    safe_assertion: "The commonly proposed reading 'House of David' is represented as a scholarly interpretation alongside published alternatives, not as an automatically decisive proof of every claim about David."
    source_refs: [tel-dan-biran-naveh-1993, tel-dan-biran-naveh-1995, tel-dan-ben-zvi-1994, tel-dan-athas-2006]
    scripture_comparison_anchors: [2Sam.1-2Sam.24, 1Kgs.1-1Kgs.2]
    uncertainty: medium
    counterpositions:
      - "The word division, restoration, referent, and historical implications have each been disputed."
      - "Secondary-use context complicates the relation between inscription date, event date, and deposition."
    cannot_establish: [all_narrative_claims_about_david, theological_status_of_david, absence_of_alternative_readings]
    required_review_classes: [northwest_semitic_epigrapher, iron_age_levant_archaeologist, hebrew_bible_historian]
    authority_effect: none
  - claim_id: claim-pilate-inscription
    case_id: pilate-inscription
    question: "What does the damaged Caesarea inscription securely preserve about Pontius Pilate and his office?"
    safe_assertion: "The inscription provides a material and epigraphic anchor for the name and official context of Pontius Pilate, while extant letters, restorations, translation, and interpretation remain separate."
    source_refs: [iip-caes0043, pilate-sherwin-white-1964]
    scripture_comparison_anchors: [Matt.27, Mark.15, Luke.23, John.18-John.19]
    uncertainty: medium
    counterpositions:
      - "The damaged title and building phrase require restoration."
      - "An official's attestation does not independently verify a particular narrative scene."
    cannot_establish: [complete_biography_of_pilate, historicity_of_each_gospel_scene, theological_meaning_of_the_passion]
    required_review_classes: [latin_epigrapher, roman_historian, new_testament_historian]
    authority_effect: none
  - claim_id: claim-jericho-chronology-control
    case_id: jericho-control
    question: "How should competing stratigraphic and chronological models be represented without converting an active archaeological problem into a binary verdict?"
    safe_assertion: "Jericho is used here as a stress test requiring explicit strata, samples, dating methods, excavation histories, and competing models rather than a confirmation/disproof scoreboard."
    source_refs:
      - jericho-garstang-1935
      - jericho-kenyon-holland-1981
      - jericho-bruins-van-der-plicht-1995
      - jericho-nigro-late-bronze-2023
      - jericho-nigro-yasine-2024
    scripture_comparison_anchors: [Josh.2-Josh.6]
    uncertainty: high
    counterpositions:
      - "Excavation interpretation and absolute chronology depend on context selection, sampling, calibration, and phase correlation."
      - "Later excavation does not erase the need to represent earlier datasets and arguments accurately."
      - "Garstang's event association and Kenyon's different stratigraphic chronology must remain distinguishable from later radiocarbon and current expedition syntheses."
    cannot_establish: [simple_proof_or_disproof, final_site_chronology, theological_causation]
    required_review_classes: [levant_archaeologist, radiocarbon_chronologist, hebrew_bible_historian]
    authority_effect: none
  - claim_id: claim-hittite-reception-control
    case_id: hittite-reception-control
    question: "Which historical entities and textual terms are being conflated when modern reception says archaeology 'proved the Hittites'?"
    safe_assertion: "The demonstration separates the Bronze Age kingdom of Hatti, later Neo-Hittite polities, biblical ethnonyms and translation choices, and modern reception claims."
    source_refs: [hittites-bryce-2005, hittites-lipinski-2012]
    scripture_comparison_anchors: [Gen.23, Josh.1.4, 2Kgs.7]
    uncertainty: medium
    counterpositions:
      - "Different passages may use terms with different social, geographic, or chronological referents."
      - "A modern slogan about prior scholarly doubt requires its own dated reception-history evidence."
    cannot_establish: [single_identity_for_every_term, universal_prior_scholarly_denial, automatic_biblical_confirmation]
    required_review_classes: [anatolian_historian, ancient_near_east_historian, hebrew_lexicographer, reception_historian]
    authority_effect: none
