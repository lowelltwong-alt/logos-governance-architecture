schema_version: logos.biblical-evidence.adversarial-fixtures.v5
object_type: deterministic_negative_fixture_catalog
trust_zone: proposed
lifecycle_status: draft
provenance_note: "Created 2026-08-26 from independent rights, graph, academic-source, and premortem review."
reason_for_inclusion: "Turn the most tempting overclaims and authority leaks into deterministic rejection tests whose exact primary mutation and derived synthetic-reseal path sets are independently reproducible."
path_binding_contract:
  schema_version: logos.biblical-evidence.fixture-path-binding.v2
  primary_path_by_target:
    agent_mesh: mesh/agent-mesh.v3.json
    archaeology_source_pack: sources/archaeology-source-pack.yaml
    completeness_receipt: release/exit-completeness-audit.yaml
    evidence_graph: graph/evidence-graph.yaml
    node_edge_catalog: graph/node-edge-catalog.yaml
    p66_crosswalk: graph/p66-chunk-crosswalk.yaml
    p66_source: sources/p66-source-and-rights.yaml
  strict_parser_primary_path_by_mutation:
    parse_duplicate_yaml_root_key: graph/evidence-graph.yaml
    parse_duplicate_json_nested_key: mesh/agent-mesh.v3.json
    parse_duplicate_review_frontmatter_key: release/independent-graph-mesh-review.md
  primary_paths_by_mutation:
    widen_displayed_through_and_add_image_edge:
      - graph/evidence-graph.yaml
      - graph/node-edge-catalog.yaml
  reseal_policy_paths:
    none: []
    synthetic_completeness_receipt_only:
      - release/exit-completeness-audit.yaml
  reseal_policy_by_target:
    agent_mesh: synthetic_completeness_receipt_only
    archaeology_source_pack: synthetic_completeness_receipt_only
    completeness_receipt: none
    evidence_graph: synthetic_completeness_receipt_only
    node_edge_catalog: synthetic_completeness_receipt_only
    p66_crosswalk: synthetic_completeness_receipt_only
    p66_source: synthetic_completeness_receipt_only
    strict_parser: none
  reseal_policy_by_mutation: {}
  default_reseal_policy: none
  actual_changed_paths_must_equal_declared_union: true
  primary_and_resealed_paths_must_be_disjoint: true
