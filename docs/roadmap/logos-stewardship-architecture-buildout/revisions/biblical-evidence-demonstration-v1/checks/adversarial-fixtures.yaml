    target: p66_source
    mutation: collapse_four_segments_to_John.19.8-John.19.24
    intended_rule: p66_non_contiguous_coverage
    expected_rule: p66_non_contiguous_coverage
    expected_first_rule: p66_non_contiguous_coverage
    expected_rules_exact: [p66_non_contiguous_coverage]
    expected_findings_ordered:
      - rule: p66_non_contiguous_coverage
        identity: "sources/p66-source-and-rights.yaml: exact four non-contiguous combined-object catalog ranges are required"
        causal_role: intended_primary
    risk: high
    reason: "The cataloged folio has gaps; a continuous range silently invents coverage."
