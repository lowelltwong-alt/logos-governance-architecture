    Source identity is the immutable parent checkpoint plus SHA-256 digests of
    the exact Git blobs at that checkpoint. An uncommitted or later committed
    append-only revision does not make the parent source lock stale merely
    because HEAD changes; missing ancestry, a rewritten parent, or a changed
    pinned Git-blob digest does.
