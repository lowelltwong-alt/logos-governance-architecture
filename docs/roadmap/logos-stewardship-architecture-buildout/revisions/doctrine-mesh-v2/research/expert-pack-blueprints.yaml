metadata:
  object_type: doctrine_expert_pack_blueprint_registry
  trust_zone: proposed
  lifecycle_status: blueprint_only_no_sources_ingested
  provenance_note: "Created on 2026-08-24 by Codex root from the expertise taxonomy and candidate source-family catalog; no web access, corpus acquisition, or qualification occurred."
  reason_for_inclusion: "Turn expert labels into buildable source, knowledge, fixture, and scope requirements while blocking agents from pretending an unbuilt pack is expertise."
schema_version: logos_doctrine_expert_pack_blueprints.v2
registry_id: LOGOS-DOCTRINE-EXPERT-PACK-BLUEPRINTS-002
global_status: no_pack_is_currently_qualified_or_execution_ready
automatic_factory_rule: "The factory may select an independently qualified exact-revision pack; it may propose an unbuilt blueprint but must block research until source, rights, fixture, and qualification gates pass."
source_discovery_rule: "Start with the named candidate source families, then verify the current primary witness, critical edition, institutional catalog, official community source, peer-reviewed scholarship, stable pointer, rights, and exact-use fitness. Search rank and model memory are discovery only."
