metadata:
  object_type: doctrine_research_source_authority_catalog
  trust_zone: proposed
  lifecycle_status: candidate_seed_catalog
  provenance_note: "Created on 2026-08-24 by Codex root from established scholarly source classes and named corpus families; no web verification or source acquisition occurred."
  reason_for_inclusion: "Give future researchers high-signal starting points while requiring current pointer, edition, rights, and fitness verification before use."
schema_version: logos_doctrine_source_authority_catalog.v2
catalog_id: LOGOS-DOCTRINE-SOURCE-CATALOG-002
current_status: candidate_pointer_families_not_yet_verified_for_access_or_rights
no_source_content_ingested: true
two_dimension_rule:
  evidentiary_reliability: "How reliably this object supports the exact historical, textual, linguistic, archaeological, philosophical, reception, or tradition claim."
  normative_christian_doctrine_authority: "Whether the governing human-approved Scripture or tradition policy admits the object as normative support."
  prohibition: "Never derive normative authority from evidentiary quality, antiquity, institutional prestige, or similarity."
source_classes:
  SC-PRIMARY-WITNESS:
    evidentiary_priority: highest_when_authentic_and_fit
    examples: [manuscript, inscription, tablet, papyrus, coin, artifact, conciliar_act, theologian_work, promulgated_confession]
    requirements: [stable_identity, provenance, edition_or_image, locator, date, source_function, limitations]
  SC-CRITICAL-EDITION:
    evidentiary_priority: high
    examples: [critical_text, apparatus, diplomatic_edition, corpus_catalog]
    requirements: [editorial_revision, witness_basis, locator_grammar, rights_and_access]
  SC-OFFICIAL-COMMUNITY:
    evidentiary_priority: high_for_current_self_description_with_scope
    examples: [official_magisterial_document, official_confession, constitution, liturgical_book, denominational_standard]
    requirements: [promulgating_body, jurisdiction, date, authority_level, current_or_historical_status]
  SC-PEER-REVIEWED-SCHOLARSHIP:
    evidentiary_priority: high_secondary
    examples: [university_press_monograph, critical_commentary, peer_reviewed_article, excavation_report]
    requirements: [author_qualification, publisher_or_journal, date, method, counterevidence, exact_page_or_section]
  SC-REFERENCE-CATALOG:
    evidentiary_priority: navigation_and_identity
    examples: [museum_catalog, manuscript_catalog, prosopography, gazetteer, lexical_database]
    requirements: [maintainer, stable_ID, revision, scope, link_to_primary_or_edition]
  SC-DISCOVERY-ONLY:
    evidentiary_priority: not_load_bearing_alone
    examples: [general_website, encyclopedia_without_primary_locator, search_snippet, repository_mirror, AI_output]
    requirements: [use_only_to_find_higher_class_source, independently_verify_every_claim]
