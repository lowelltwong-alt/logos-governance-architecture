source_admission_workflow:
  - verify current stable pointer and source identity
  - verify edition witness catalog or promulgating authority
  - record evidentiary source class and exact claim fitness
  - record normative authority independently
  - verify rights access retention quotation and provider egress
  - qualify locators translations context and known limitations
  - independently re-access before material use
  - preserve source_unavailable or disputed status instead of inheriting a summary
prohibited_shortcuts:
  - web_search_rank_as_quality
  - publisher_brand_as_entailment
  - official_site_as_universal_historical_authority
  - public_access_as_AI_or_redistribution_permission
  - modern_translation_as_original_language_proof
  - agent_or_ExpertPack_summary_as_root_evidence
