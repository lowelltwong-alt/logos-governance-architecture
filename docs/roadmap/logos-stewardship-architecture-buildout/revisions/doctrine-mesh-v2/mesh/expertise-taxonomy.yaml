  methods_and_safeguards:
    - {profile_id: MTH-SYSTEMATIC, label: systematic_doctrine_method, detects: [locus_coherence, conceptual_distinction, normative_claim], limit: "Cannot establish source authority or canon."}
    - {profile_id: MTH-BIBLICAL, label: biblical_doctrine_method, detects: [canonical_pattern, intertext, redemptive_historical_claim], limit: "Method and canon scope must be explicit and human-governed."}
    - {profile_id: MTH-HISTORICAL, label: historical_doctrine_method, detects: [development, controversy, reception, discontinuity], limit: "Chronology does not establish truth."}
    - {profile_id: MTH-PHILOSOPHICAL, label: philosophical_doctrine_method, detects: [validity, category_error, metaphysical_assumption], limit: "Coherence does not establish revelation or doctrine."}
    - {profile_id: MTH-SOCIAL-HISTORY, label: social_and_material_history_method, detects: [practice_context, institution, demography, material_constraint], limit: "Description has no normative doctrinal force."}
    - {profile_id: MTH-RIGHTS, label: rights_privacy_and_custody_method, detects: [license, access, retention, egress, attribution], limit: "Access is not permission and cannot be inferred."}
    - {profile_id: MTH-GRAPH, label: provenance_and_graph_method, detects: [lineage_gap, stale_dependency, unsupported_edge, blast_radius], limit: "Graph presence and centrality are not truth."}
required_gap_question: >-
  For every candidate missing role, state the unique error class it could detect,
  why assigned roles cannot detect it adequately, the likely decision value,
  cost and delay, risk if omitted, and whether it is needed now, on a trigger,
  or not at all. Prestige, denominational balance, and role count are not enough.
