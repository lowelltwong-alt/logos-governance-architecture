role_reconciliation:
  - {prior_role: historical-theology-researcher, disposition: split, current_roles: [bounded-domain-researcher, citation-locator-verifier, source-authority-verifier, claim-entailment-verifier, counterevidence-challenger, tradition-representation-auditor], reason: "One role could author and implicitly validate its own sources, meaning, and tradition scope."}
  - {prior_role: null, disposition: added, current_roles: [doctrine-mesh-completeness-auditor, doctrine-task-local-role-factory, goal-alignment-authority-auditor, risk-human-gate-router], reason: "New explicit lifecycle, autonomy, alignment, and risk requirements."}
  - {prior_role: every_domain_role_standing, disposition: removed, current_roles: [], reason: "Dynamic trigger-based staffing is safer and cheaper than an always-on ceremonial swarm."}
new_required_controls:
  - source catalog entries remain candidate pointers until independently verified
  - a role cannot verify a source it cannot re-access
  - KnowledgeGuides and external frontier outputs are non-evidentiary
  - repeated role failures can propose but not self-apply a reusable improvement
  - independent checker must challenge role omissions and the auditor itself
  - Fable and external frontier review remain manual exact-attempt human gates
