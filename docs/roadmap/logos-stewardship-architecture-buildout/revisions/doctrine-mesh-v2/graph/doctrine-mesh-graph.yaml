  horizontal: [checks, challenges, appeals, represents, conflicts_with]
  depth: [derived_from, cites, contextualizes, documents_reception, stored_in, qualified_by, validated_by]
  temporal: [supersedes, invalidates, stale_due_to, triggered_by, precedes]
  forbidden_load_bearing: [related_to]
