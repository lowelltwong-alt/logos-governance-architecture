  - claim
  - source_manifest
  - evidence_packet
  - role_requirement
  - role_profile
  - qualification_pack
  - audit_event
  - audit_receipt
  - decision_record
  - human_gate
  - repository_plane
  - validation_receipt
  - dissent
edge_types:
