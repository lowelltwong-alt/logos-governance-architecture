metadata:
  object_type: doctrine_mesh_typed_graph
  trust_zone: proposed
  lifecycle_status: specification_only
  provenance_note: "Created on 2026-08-24 by Codex root as the vertical, horizontal, depth, and temporal graph for expert routing and evidence flow."
  reason_for_inclusion: "Make source authority, role checks, disputes, human gates, repository planes, and audit lifecycle relationships inspectable and machine-testable."
schema_version: logos_doctrine_mesh_graph.v2
graph_id: LOGOS-DOCTRINE-MESH-GRAPH-002
node_types:
