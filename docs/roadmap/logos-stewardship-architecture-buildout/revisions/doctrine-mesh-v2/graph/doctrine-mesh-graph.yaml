reverse_provenance_requirement: "Every conclusion must traverse through inference and evidence to a root source manifest; no agent summary can terminate the path."
cycle_policy: "Only explicit appeal/challenge cycles are allowed; each has one response ceiling, a human escalation owner, and a stop condition."
dispatch_policy: "Only N-CONTROLLER may originate delegates_to; the role factory proposes profiles and never grants leases or creates child work."
freshness_policy: "A changed source, role, prompt, runtime, schema, authority, risk, or consumer triggers affected-slice invalidation and a new audit event."
