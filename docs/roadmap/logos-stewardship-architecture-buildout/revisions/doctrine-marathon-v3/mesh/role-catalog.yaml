metadata:
  object_type: doctrine_marathon_role_capability_catalog
  trust_zone: proposed
  lifecycle_status: dormant_specification
  provenance_note: Created on 2026-08-27 by Codex root as a non-exhaustive, extensible classification of task-local expertise.
  reason_for_inclusion: Give the role factory stable capability facets while requiring evidence of added value and forbidding thin expert personas.
schema_version: logos.doctrine_marathon.role_catalog.v3
catalog_id: LOGOS-DOCTRINE-ROLE-CATALOG-003
classification_rule: A capability facet describes a bounded error class or source route. It is not an expert credential. A task-local role requires a qualified ExpertPack and a documented expected-information-gain statement.
