extension_contract:
  new_facet_requires:
  - stable capability identifier
  - named error class or source route
  - evidence that an existing facet cannot cover it
  - expected information gain
  - required ExpertPack fields
  - checker and independence requirements
  - risk tier and human gate
  automatic_global_promotion_allowed: false
forbidden_shortcuts:
- generic_expert_on_all_theology
- generic_expert_on_all_church_fathers
- tradition_label_without_primary_self_descriptive_sources
- liberal_or_conservative_as_unparsed_machine_classification
- powerful_model_equals_qualified_expert
- many_agents_equals_independence
proposed_role_gaps:
- gap_id: DMV3-GAP-PATRISTIC-GREEK
  proposed_capability_id: patristic_greek
  status: proposed_unapproved
  named_error_or_source_route: Distinguish post-biblical patristic Greek diction, genre, textual transmission, and semantic range from biblical-corpus language work.
  approved_facets_considered:
  - apostolic_fathers
  - septuagint_and_koine_greek
  - original_language_and_translation_fidelity
  non_substitutable_by:
  - septuagint_and_koine_greek
  - original_language_and_translation_fidelity
  why_insufficient: Biblical Koine and general translation checking do not establish competence in patristic idiom, authorial corpora, critical editions, or reception-specific usage.
  expected_information_gain: Reduce anachronistic lexical transfer and identify witness- or author-specific language questions that require a qualified patristics specialist.
  required_expert_pack_fields: &id001
  - capability_ids
  - scope
  - exclusions
  - source_manifest_bindings
  - fixture_result_bindings
  - qualification_receipt_refs
  - invalidation_triggers
  - non_authority
  checker_capability_ids:
  - quotation_context_and_entailment
  - role_qualification_and_independence
  risk_tier: high
  human_gate_ids:
  - original_language_or_translation_review_when_material
  - patristics_or_period_specialist_review_when_material
- gap_id: DMV3-GAP-PATRISTIC-TEXTUAL-HISTORY
  proposed_capability_id: patristic_textual_history_and_critical_editions
  status: proposed_unapproved
  named_error_or_source_route: Qualify patristic witnesses, recensions, editions, attribution states, and apparatus conventions before evidentiary use.
  approved_facets_considered:
  - apostolic_fathers
  - manuscript_codicology_and_papyrology
  - new_testament_textual_criticism
  non_substitutable_by:
  - manuscript_codicology_and_papyrology
  - new_testament_textual_criticism
  why_insufficient: General manuscript study and New Testament criticism do not by themselves cover the work-specific transmission and editorial history of patristic corpora.
  expected_information_gain: Expose recension, attribution, edition, and apparatus risks before quotations or translations become load-bearing evidence.
  required_expert_pack_fields: *id001
  checker_capability_ids:
  - source_identity_locator_and_rights
  - role_qualification_and_independence
  risk_tier: high
  human_gate_ids:
  - patristics_or_period_specialist_review_when_material
  - source_rights_privacy_and_custody_review
- gap_id: DMV3-GAP-EARLY-CHRISTIAN-CHRONOLOGY
  proposed_capability_id: late_first_or_early_second_century_christian_context_with_date_uncertainty
  status: proposed_unapproved
  named_error_or_source_route: Represent uncertain early-Christian chronology, authorship, community setting, and competing historical reconstructions without false precision.
  approved_facets_considered:
  - apostolic_fathers
  - modern_historical_theology
  - roman_law_politics_and_social_history
  non_substitutable_by:
  - apostolic_fathers
  - modern_historical_theology
  why_insufficient: Corpus familiarity and broad historical theology do not alone resolve the specialized chronology and provenance disputes attached to individual early texts.
  expected_information_gain: Preserve competing date and provenance hypotheses and prevent a convenient chronology from silently controlling downstream interpretation.
  required_expert_pack_fields: *id001
  checker_capability_ids:
  - counterevidence_and_alternative_hypotheses
  - role_qualification_and_independence
  risk_tier: high
  human_gate_ids:
  - patristics_or_period_specialist_review_when_material
- gap_id: DMV3-GAP-ROMAN-CORINTHIAN-ECCLESIAL-CONTEXT
  proposed_capability_id: roman_and_corinthian_ecclesial_context
  status: proposed_unapproved
  named_error_or_source_route: Reconstruct bounded Roman and Corinthian ecclesial, social, and institutional context for early reception claims.
  approved_facets_considered:
  - apostolic_fathers
  - roman_law_politics_and_social_history
  - greco_roman_religions_and_civic_cults
  non_substitutable_by:
  - roman_law_politics_and_social_history
  - greco_roman_religions_and_civic_cults
  why_insufficient: Broad Roman social or religious context does not establish the local ecclesial history and source-specific relationships needed for this work unit.
  expected_information_gain: Separate warranted local context from broad Greco-Roman generalization and surface where the surviving evidence cannot decide between reconstructions.
  required_expert_pack_fields: *id001
  checker_capability_ids:
  - quotation_context_and_entailment
  - counterevidence_and_alternative_hypotheses
  - role_qualification_and_independence
  risk_tier: high
  human_gate_ids:
  - patristics_or_period_specialist_review_when_material
