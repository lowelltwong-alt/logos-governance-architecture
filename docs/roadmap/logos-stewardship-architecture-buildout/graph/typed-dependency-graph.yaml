metadata:
  object_type: stewardship_architecture_typed_dependency_graph
  trust_zone: proposed
  lifecycle_status: specification_only
  provenance_note: "Created on 2026-08-23 by Codex root from the reconciled family claim, pinned source lock, block registry, human-gate registry, and atomic job catalog."
  reason_for_inclusion: "Make dependency, provenance, authority, freshness, blocking, and reverse-blast relationships explicit and machine-auditable before any implementation is considered."
schema_version: logos_stewardship_typed_dependency_graph.v1
graph_id: LOGOS-STEWARDSHIP-GRAPH-001
revision: 1
execution_authority: false
graph_semantics: closed_world_multigraph
planes:
  semantic: [immutable_source, evidence, inference, conclusion]
  control: [job, human_gate, block, validation]
  delivery: [artifact, consumer, runtime_adapter, implementation_action]

node_contract:
  required_fields: [node_id, node_kind, trust_zone, authority_owner, lifecycle_status, freshness_state]
  trust_zones: [canonical, tradition-scoped, proposed, inferred, deprecated, learning-sidecar]
  missing_authority_owner_is_error: true
  missing_freshness_is_error: true
edge_contract:
  required_fields: [edge_id, source_id, target_id, relation, provenance_ref]
  inherited_defaults_allowed: true
  defaults:
    asserted_by: specification-writer
    review_state: proposed
    observed_at: "2026-08-23T20:11:49Z"
    valid_from: "2026-08-23T20:11:49Z"
    valid_until: null
    freshness_state: current_at_observation
    invalidation_action: mark_transitive_consumers_stale_and_block_affected_jobs
  allowed_relations:
    depends_on:
      inverse: required_by
      meaning: "The source job or artifact cannot be satisfied without the target prerequisite."
      acyclic: true
    derived_from:
      inverse: supports_derivation_of
      meaning: "A conclusion derives from an inference, an inference from evidence, or evidence from an immutable source."
      acyclic: true
    produces:
      inverse: produced_by
      meaning: "A job creates a proposed artifact or validation result."
      acyclic: false
    consumes:
      inverse: consumed_by
      meaning: "A job reads an artifact without changing its authority."
      acyclic: false
    consumed_by:
      inverse: consumes
      meaning: "An artifact has a known downstream consumer used for reverse blast-radius analysis."
      acyclic: false
    validates:
      inverse: validated_by
      meaning: "A validation node evaluates an artifact or assertion against a declared rule."
      acyclic: false
    reviewed_by:
      inverse: reviews
      meaning: "A candidate is reviewed by an independent role or a named human authority."
      acyclic: false
    challenges:
      inverse: challenged_by
      meaning: "Evidence or review disputes a candidate without silently deleting it."
      acyclic: false
    governs:
      inverse: governed_by
      meaning: "A source contract constrains a job, artifact, or action."
      acyclic: false
    blocks:
      inverse: blocked_by
      meaning: "An active block or unclosed human gate dominates any positive readiness path to the target."
      acyclic: false
    authorizes:
      inverse: authorized_by
      meaning: "Only a fresh scoped human receipt may authorize the exact target action; no such receipt exists in this revision."
      acyclic: false
    supersedes:
      inverse: superseded_by
      meaning: "A newer revision replaces a prior revision without deleting history."
      acyclic: true
    migrates_to:
      inverse: migrates_from
      meaning: "A separately authorized migration maps source to target with rollback evidence."
      acyclic: true
  prohibited_relations: [related_to, associated_with, implies_authority]

