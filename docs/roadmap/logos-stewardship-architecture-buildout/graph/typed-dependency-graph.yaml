proof_obligations:
  - obligation_id: PO-IDENTITY
    rule: "Every node and edge ID is unique, every endpoint exists, and every load-bearing edge uses the closed vocabulary."
    evidence: checks/validation-receipt.json
    status: pending_validation
  - obligation_id: PO-ACYCLIC
    rule: "The depends_on subgraph and the derived_from subgraph are acyclic."
    evidence: checks/validation-receipt.json
    status: pending_validation
  - obligation_id: PO-REVERSE-PROVENANCE
    rule: "Every material conclusion reverse-traverses conclusion -> inference -> evidence -> immutable source; a summary never substitutes for a source."
    evidence: checks/provenance-review.json
    status: pending_independent_review
  - obligation_id: PO-TRUST-DIRECTION
    rule: "Derived or inferred content cannot become canonical through reachability, validation, consensus, or graph placement."
    evidence: checks/provenance-review.json
    status: pending_independent_review
  - obligation_id: PO-BLOCK-DOMINANCE
    rule: "Every advisory, P0, P1, residual, SPECIAL, and applicable human gate has an active blocks edge that dominates readiness for implementation."
    evidence: checks/block-replay.json
    status: pending_validation
  - obligation_id: PO-FRESHNESS
    rule: "Digest, authority, policy, schema, privacy, runtime, dependency, or scope drift marks affected consumers stale; age alone cannot promote authority."
    evidence: checks/source-lock.json
    status: pending_validation
  - obligation_id: PO-REVERSE-BLAST-RADIUS
    rule: "A changed or revoked source, evidence item, gate, schema, or adapter reaches all downstream conclusions, jobs, artifacts, validations, consumers, and implementation actions."
    evidence: checks/provenance-review.json
    status: pending_independent_review
  - obligation_id: PO-MIGRATION-SAFETY
    rule: "No migrates_to or implementation edge becomes active without source/target revisions, consumer inventory, compatibility proof, privacy classification, rollback, kill criteria, and exact human receipt."
    evidence: checks/future-gates.json
    status: blocked_human

readiness_semantics:
  positive_dependencies_are_insufficient: true
  active_blocks_dominate: true
  missing_or_expired_human_receipt_means: blocked_human
  validator_pass_grants_authority: false
  model_consensus_grants_authority: false
  current_implementation_readiness: false

reverse_blast_radius:
  start_node_kinds: [immutable_source, evidence, human_gate, block, runtime_adapter]
  traverse_inverse_relations: [supports_derivation_of, consumed_by, required_by, validated_by, produced_by]
  dispositions: [stale, revalidate, blocked, quarantine]
  stop_at_visibility_boundary: false
  redact_private_payloads_in_reports: true

cycle_policy:
  acyclic_relations: [depends_on, derived_from, supersedes, migrates_to]
  allowed_process_cycles_require:
    - explicit_exit_condition
    - bounded_attempt_count
    - append_only_attempt_receipt
    - independent_recheck_after_repair
  current_allowed_process_cycles: []

validation_policy:
  unknown_relation_is_error: true
  orphan_load_bearing_node_is_error: true
  missing_reverse_consumer_is_error: true
  numeric_constraint_on_special_001_is_error: true
  authorizes_edge_without_human_receipt_is_error: true
  implementation_edge_in_this_revision_is_error: true
