advisory_rows:
  - advisory_id: ADVISORY-001
    normalized_text: "Candidate normalization: Keep the current governance repository and its incoming/research staging lane as the present program home; do not create a new repository unless an independently owned lifecycle or private/runtime boundary is demonstrated and the owner approves it. Staging is not promotion. Neither architect is recorded as accepting this text, and no human gate or implementation authority is satisfied."
    sha256: 4e179aea2d3620c96d58ee5fcbf8dada52ca9c4960e30e57cc52210ac71c4c1f
  - advisory_id: ADVISORY-002
    normalized_text: "Candidate normalization: Represent a missing or inaccessible source with a scoped docket record and unavailable quotation status; do not reconstruct quotations, paraphrase memory as source content, or infer contents beyond the documented search. The record proves only unavailability within its named scope. Neither architect is recorded as accepting this text, and all source-access, rights, and human review gates remain unsatisfied."
    sha256: 9769d0f4453d4ec3f0049031208debc229bdbbfbae3fdf9cd1307c48854d3aad
  - advisory_id: ADVISORY-003
    normalized_text: "Candidate normalization: Keep source identity, exact quotation replay, context, genre, addressee, plural readings, non-claims, routed original-language questions, qualified exegesis, and reception review as distinct records or gates. Structural or quotation checks do not certify interpretation. Neither architect is recorded as accepting this text, and theology, source-authority, and qualified-human gates remain unsatisfied."
    sha256: 5235a1607e495b5b7b3b7092bc3dc72a4ff3daaa29b42f9149f5dbc0e27a974b
  - advisory_id: ADVISORY-004
    normalized_text: "Candidate normalization: Use task-decision pairs, preserve accountable human responsibility, evaluate worker and beneficiary harms, require rollback, and prohibit person-level monitoring until approved privacy, retention, access, and consultation rules exist. These are candidate work-design controls, not facts or policy about an institution. Neither architect is recorded as accepting this text, and every privacy, workforce, institution, and adoption gate remains unsatisfied."
    sha256: cac88001f2be264800c79b1c475ee9717a037b22f7bc29a0dba81da85bab8874
  - advisory_id: ADVISORY-005
    normalized_text: "Candidate normalization: Treat fixed agent counts, wave counts, file caps, literal scanners, and current execution separation as replaceable operating choices; preserve provider-neutral provenance, evidence floors, named human authority, explicit uncertainty, and replay as the durable controls. Neither architect is recorded as accepting this text, and no route selection, human gate, or implementation authority is supplied."
    sha256: 50272c5db8975a3072f700d864789f44897d6b7594d7d0428c57ff9e40be027e
  - advisory_id: ADVISORY-006
    normalized_text: "Candidate normalization: Treat the governed source plane as mechanically resolvable only to the extent replay demonstrates; quotation fitness requires a precise span, elision, emphasis, and composite contract, while context and interpretation require qualified human review. Do not infer corpus-wide quotation or exegesis fitness from one checked extraction. Neither architect is recorded as accepting this text, and source-authority, theology, review, and implementation gates remain unsatisfied."
    sha256: db6fcf1baa8788aafbfb3c7f33f489dd02b1ff19743a74fe34fce6f4372f0ddd
  - advisory_id: ADVISORY-007
    normalized_text: "Candidate normalization: Treat the existing ten-agent, five-wave topology as one benchmark arm, not a default; compare it with human-only, deterministic-only, and single-agent routes, and select the smallest route shown sufficient on accepted evidence, independent defect discovery, privacy, elapsed time, reviewer and owner minutes, retries, rework, and total cost. Neither architect is recorded as accepting this text, and no experiment, budget, route, or implementation is authorized."
    sha256: 8db38fc52aa152a7f3d97e1f299f846a30082edc02a6fd661959448bd6473d62
