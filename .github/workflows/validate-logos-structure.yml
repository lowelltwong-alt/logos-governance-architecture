name: Validate Logos Structure

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate node frontmatter
        run: python scripts/validate_node_frontmatter.py

      - name: Validate claim files
        run: python scripts/validate_claim_files.py

      - name: Validate controlled vocabulary
        run: python scripts/validate_trust_zone_vocabulary.py

      - name: Validate Noesis boundary (Noesis may inform Logos, never govern it)
        run: python scripts/validate_noesis_boundary.py

      - name: Validate external advisory authority firewall
        run: python scripts/validate_external_advisory_authority_firewall.py

      - name: Reject machine-local citation artifacts
        run: python scripts/validate_machine_citation_artifacts.py
