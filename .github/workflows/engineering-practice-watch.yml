name: Engineering Practice Watch

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"
      timezone: "America/New_York"

permissions:
  contents: read
  issues: write

concurrency:
  group: engineering-practice-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML
      - name: Validate observatory
        run: python scripts/validate_engineering_practice_observatory.py
      - name: Run deterministic watch
        id: watch
        shell: bash
        run: |
          mkdir -p reports/engineering-practice-watch
          kind=weekly
          changed=()
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            kind=event
            while IFS= read -r path; do changed+=(--changed-file "$path"); done < <(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            kind=manual
          fi
          python scripts/run_engineering_practice_watch.py \
            --run-kind "$kind" "${changed[@]}" \
            --output-json reports/engineering-practice-watch/latest.json \
            --output-md reports/engineering-practice-watch/latest.md
          cat reports/engineering-practice-watch/latest.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: engineering-practice-watch
          path: reports/engineering-practice-watch/
      - name: Create visible overdue issue
        if: steps.watch.outputs.action_required == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh label create engineering-practice-watch --color 1D76DB --description "Recurring engineering-practice evidence review" --force
          existing=$(gh issue list --state open --label engineering-practice-watch --json number --jq 'length')
          if [[ "$existing" == "0" ]]; then
            gh issue create --title "Engineering Practice Observatory review is due" \
              --label engineering-practice-watch \
              --body-file reports/engineering-practice-watch/latest.md
          fi
