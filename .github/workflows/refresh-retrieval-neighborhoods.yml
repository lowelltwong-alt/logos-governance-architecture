name: Refresh Retrieval Neighborhoods

# The retrieval-neighborhood validator fails any bundle older than
# stale_after_days (30). Without a refresh job, `main` goes red on a 30-day
# clock even when nothing is wrong. This job regenerates the deterministic
# bundles on a schedule and opens a PR only when content actually changes.

on:
  schedule:
    - cron: '0 6 1,15 * *'   # 1st and 15th of each month, well inside the 30-day window
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Regenerate neighborhoods and open PR on drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate retrieval neighborhoods
        run: python3 scripts/generate_retrieval_neighborhoods.py

      - name: Validate regenerated neighborhoods
        run: python3 scripts/validate_retrieval_neighborhoods.py

      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(retrieval): scheduled neighborhood refresh"
          branch: chore/refresh-retrieval-neighborhoods
          delete-branch: true
          title: "chore(retrieval): scheduled neighborhood refresh"
          body: |
            Automated regeneration of `data/retrieval/*-neighborhood.auto.*`.

            Deterministic regeneration; expected diff is the `generated_at`
            timestamp plus any genuine claim/graph changes since last refresh.

            ### Invariant impact statement (required)
            None. Regenerated artifacts only; no governed source content changed.

            ### Trust zone declaration (required)
            Touches generated artifacts derived from canonical/tradition-scoped/proposed claims only.

            ### Provenance note update (required)
            Auto-generated by `generate_retrieval_neighborhoods.py`; provenance is the generator + upstream claims.

            ## Drift check (required)

            ### Old rule preserved
            Staleness threshold and generation rules unchanged.

            ### Intentional change
            Refresh `generated_at` so bundles stay within the freshness window.

            ### Unchanged surface
            Generator logic, schemas, validators.
