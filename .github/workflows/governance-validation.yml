name: Governance Validation

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: governance-validation-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
  push:
    branches: ["main"]

jobs:
  family_work_registry_validator:
    name: Family work registry validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependency
        run: python -m pip install PyYAML

      - name: Validate work claims, lifecycle, leases, and overlap
        run: python scripts/validate_family_work_registry.py

      - name: Require one active claim for the pull-request branch
        if: github.event_name == 'pull_request'
        run: python scripts/validate_family_work_registry.py --require-branch "${{ github.head_ref }}"

  metadata_schema_validator:
    name: Metadata schema validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate governance metadata schema
        run: python3 scripts/validate_governance_metadata.py

  trust_zone_policy_validator:
    name: Trust-zone policy validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate trust-zone policy
        run: python3 scripts/validate_trust_zone_vocabulary.py

  docs_link_lint_check:
    name: Docs link/lint check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate internal docs links
        run: python3 scripts/validate_internal_links.py --all-markdown
