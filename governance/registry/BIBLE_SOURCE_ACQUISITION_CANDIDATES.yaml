object_type: bible_source_acquisition_candidate_register
trust_zone: proposed
lifecycle_status: active
provenance_note: "Created 2026-07-10 as the first OD-C-OPEN-A rights-preflight register using official source and license pages; no source content was acquired."
reason_for_inclusion: "Give independent and church-based scholarship a practical path toward more Bible sources while requiring source-by-source rights, edition, attribution, and distribution review before import."
register_id: logos_bible_source_acquisition_candidates_v1
owner_decision_ref: governance/INDEPENDENT_STUDY_SOURCE_AUTHORIZATION.yaml
