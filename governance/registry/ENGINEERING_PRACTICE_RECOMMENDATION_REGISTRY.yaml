  - practice_id: EPR-006
    title: Prefer small coherent changes over large mixed changes
    problem: "Large mixed changes are difficult to understand, test, review, revert, and run safely in parallel."
    beginner_explanation: "Make each pull request answer one coherent question. Do not split an invariant or migration so finely that the intermediate state becomes unsafe."
    recommendation_status: adopt
    evidence_source_ids: [EPS-GOOGLE-002]
    evidence_summary: "Google recommends small self-contained changes for design, review, testing, and delivery quality."
    logos_fit: "Matches the governed PR sequence, provided cross-file contracts and required companion registers remain in the same atomic change."
    fit_dimensions: {solo_maintainer_fit: high, theological_safety: high, auditability: high, economic_efficiency: high, operational_complexity: low, future_scalability: high}
    benefits: [reviewability, safer_parallelism, easier_revert, clearer_audit]
    risks: [unsafe_fragmentation, excess_pr_overhead]
    when_to_use: [independent_governance_layer, focused_validator, isolated_research_packet, narrow_bug_fix]
    when_not_to_use: [change_requires_atomic_schema_validator_and_migration_contract]
