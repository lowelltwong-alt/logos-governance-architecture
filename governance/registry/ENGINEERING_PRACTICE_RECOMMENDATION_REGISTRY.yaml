    supersedes: []
    deprecated_by: null
  - practice_id: EPR-003
    title: Keep repository knowledge versioned, indexed, and progressively disclosed
    problem: "Agents cannot reliably use decisions that live only in chat, memory, or one enormous instruction file."
    beginner_explanation: "Store durable decisions near the code, give agents a short map to the right document, and mechanically check links, freshness, and ownership."
    recommendation_status: adopt
    evidence_source_ids: [EPS-OPENAI-001, EPS-ANTHROPIC-003]
    evidence_summary: "OpenAI describes repository knowledge as the system of record with progressive disclosure; Anthropic emphasizes persistent artifacts between long-running sessions."
    logos_fit: "Directly fits Logos decision registers, AI tables of contents, handoffs, lessons, dependency maps, and work claims."
    fit_dimensions: {solo_maintainer_fit: high, theological_safety: high, auditability: high, economic_efficiency: high, operational_complexity: medium, future_scalability: high}
    benefits: [durable_context, newcomer_onboarding, deterministic_discovery, reduced_chat_dependency]
    risks: [documentation_sprawl, stale_duplicate_surfaces]
    when_to_use: [durable_decision, architecture_rule, reusable_lesson, multi_session_work]
    when_not_to_use: [ephemeral_scratch_note_without_downstream_effect]
    owner_decision_required: false
    implementation_surfaces: [AI_TABLE_OF_CONTENTS.md, governance/GOVERNANCE_DEPENDENCY_MAP.yaml]
    last_reviewed_at: "2026-07-10"
