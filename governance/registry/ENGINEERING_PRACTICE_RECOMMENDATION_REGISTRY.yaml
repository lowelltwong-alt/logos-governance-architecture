  - practice_id: EPR-005
    title: Use redundant scheduled and event-triggered practice review
    problem: "A maintainer can forget manual research, while scheduled automation may be delayed or disabled."
    beginner_explanation: "Run a cheap check when relevant changes happen, schedule a weekly reminder at an off-hour minute, and keep a manual button. If a review becomes overdue, create a visible issue."
    recommendation_status: pilot
    evidence_source_ids: [EPS-GITHUB-001, EPS-GITHUB-002]
    evidence_summary: "GitHub documents scheduled, pull-request, and manual triggers and warns that scheduled runs can be delayed and depend on default-branch activity."
    logos_fit: "Strong fit when the scheduled job detects due work but does not pretend to complete research or adopt recommendations."
    fit_dimensions: {solo_maintainer_fit: high, theological_safety: high, auditability: high, economic_efficiency: high, operational_complexity: low, future_scalability: high}
    benefits: [reduced_forgetting, visible_overdue_state, manual_recovery, low_idle_cost]
    risks: [alert_fatigue, schedule_delay, stale_issue_noise]
    when_to_use: [practice_source_review, documentation_gardening, dependency_watch, recurring_audit]
    when_not_to_use: [automatic_governance_adoption, autonomous_theological_decision]
    owner_decision_required: false
    implementation_surfaces: [.github/workflows/engineering-practice-watch.yml, scripts/run_engineering_practice_watch.py]
    last_reviewed_at: "2026-07-10"
