recommendations:
  - practice_id: EPR-001
    title: Use the simplest composable workflow before adding a swarm
    problem: "Agent count and orchestration complexity can grow faster than demonstrated task value."
    beginner_explanation: "Start with one capable worker and deterministic checks. Add specialist or parallel agents only when the work truly needs different expertise, independent review, or parallel research."
    recommendation_status: adopt
    evidence_source_ids: [EPS-ANTHROPIC-001, EPS-ANTHROPIC-002]
    evidence_summary: "Anthropic distinguishes workflows from agents, recommends simple composable patterns, and uses multi-agent delegation where research breadth benefits from parallel search."
    logos_fit: "Strong fit because Logos has many deterministic tasks but reserves costly specialist review for Greek, Hebrew, textual criticism, theology, ontology, and high-leverage architecture."
    fit_dimensions: {solo_maintainer_fit: high, theological_safety: high, auditability: high, economic_efficiency: high, operational_complexity: low, future_scalability: high}
    benefits: [lower_cost, easier_debugging, explicit_escalation, less_duplicate_work]
    risks: [under_escalation_if_triggers_are_incomplete]
    when_to_use: [routine_validation, bounded_code_change, known_schema_work, source_catalog_grunt_work]
    when_not_to_use: [cross_disciplinary_research, independent_theological_review, broad_parallel_source_discovery]
    owner_decision_required: false
    implementation_surfaces: [governance/registry/agent_routing_vocabulary.yaml]
    last_reviewed_at: "2026-07-10"
    next_review_due: "2026-10-08"
