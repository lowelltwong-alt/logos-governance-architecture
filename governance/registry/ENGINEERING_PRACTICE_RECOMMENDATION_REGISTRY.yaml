  - practice_id: EPR-002
    title: Require independent review for high-leverage agent changes
    problem: "An implementing agent can share its own blind spots and rationalize defects in its solution."
    beginner_explanation: "Let one agent build, then give a separate reviewer the change, requirements, and tests. The reviewer should try to disprove correctness instead of continuing the author's reasoning."
    recommendation_status: adopt
    evidence_source_ids: [EPS-OPENAI-001, EPS-GOOGLE-001]
    evidence_summary: "OpenAI reports targeted agent review loops, while Google treats independent review as a mechanism for improving code health."
    logos_fit: "Strong for governance, authority boundaries, chunking, textual-critical infrastructure, and cross-repo architecture; excessive for trivial metadata formatting."
    fit_dimensions: {solo_maintainer_fit: medium, theological_safety: high, auditability: high, economic_efficiency: medium, operational_complexity: medium, future_scalability: high}
    benefits: [independent_defect_discovery, architecture_review, audit_evidence]
    risks: [token_cost, correlated_model_errors, review_theater]
    when_to_use: [governance_change, output_change, authority_change, shared_schema, security_or_rights_change]
    when_not_to_use: [mechanical_low_risk_edit_with_complete_deterministic_tests]
    owner_decision_required: false
    implementation_surfaces: [docs/governance/agent-skills/capability-first-routing-standard.md]
    last_reviewed_at: "2026-07-10"
