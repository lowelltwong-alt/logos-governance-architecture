  - practice_id: EPR-004
    title: Treat continuous board-driven agents as a bounded pilot, not the default
    problem: "Always-on agents can consume cost, multiply conflicts, and outrun human or theological review capacity."
    beginner_explanation: "A task board can wake agents automatically, but only use that mode for work with clear claims, tests, budgets, stop rules, and review capacity."
    recommendation_status: watch
    evidence_source_ids: [EPS-OPENAI-002, EPS-ANTHROPIC-001]
    evidence_summary: "OpenAI reports board-driven continuous orchestration; Anthropic cautions that agentic complexity trades cost and latency for performance."
    logos_fit: "Useful later for deterministic maintenance and research-watch queues, but inappropriate as a universal Logos execution mode today."
    fit_dimensions: {solo_maintainer_fit: low, theological_safety: medium, auditability: medium, economic_efficiency: low, operational_complexity: high, future_scalability: high}
    benefits: [reduced_forgetting, queue_throughput, background_maintenance]
    risks: [cost_runaway, duplicate_work, review_overload, authority_leakage]
    when_to_use: [bounded_scheduled_audit, deterministic_maintenance, explicit_budgeted_pilot]
    when_not_to_use: [theological_decision, owner_gate, source_import, output_change, ambiguous_research]
    owner_decision_required: true
    implementation_surfaces: [governance/registry/FAMILY_WORK_REGISTRY.yaml]
